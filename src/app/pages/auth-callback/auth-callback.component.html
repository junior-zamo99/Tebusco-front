<div class="min-h-screen bg-background flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">

    <!-- Logo -->
    <div class="text-center">
      <img src="/assets/img/logo/logo.png" alt="Logo TEBUSCO" class="mx-auto w-auto h-16 object-contain">
    </div>

    <!-- Loading State -->
    @if (status() === 'loading') {
      <div
        class="backdrop-blur-xl bg-white/5 rounded-3xl p-8 border border-white/10 shadow-2xl text-center">
        <div class="flex flex-col items-center gap-6">
          <!-- Spinner -->
          <div class="relative">
            <svg class="animate-spin h-16 w-16 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-white mb-2">{{ message() }}</h2>
            <p class="text-gray-400 text-sm">Por favor espera un momento</p>
          </div>
        </div>
      </div>
    }

    <!-- Success State -->
    @if (status() === 'success') {
      <div
        class="backdrop-blur-xl bg-emerald-500/10 rounded-3xl p-8 border border-emerald-500/30 shadow-2xl text-center animate-fadeIn">
        <div class="flex flex-col items-center gap-6">
          <!-- Check Icon -->
          <div class="w-16 h-16 rounded-full bg-emerald-500/20 flex items-center justify-center">
            <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-emerald-300 mb-2">{{ message() }}</h2>
            <p class="text-gray-400 text-sm">Serás redirigido automáticamente</p>
          </div>
        </div>
      </div>
    }

    <!-- Error State -->
    @if (status() === 'error') {
      <div
        class="backdrop-blur-xl bg-red-500/10 rounded-3xl p-8 border border-red-500/30 shadow-2xl text-center animate-fadeIn">
        <div class="flex flex-col items-center gap-6">
          <!-- Error Icon -->
          <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center">
            <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-red-300 mb-2">{{ message() }}</h2>
            <p class="text-gray-400 text-sm">Por favor intenta nuevamente</p>
          </div>
        </div>
      </div>
    }

  </div>
</div>
