<div class="flex flex-col h-full font-sans bg-surface text-text">

  <div class="px-6 py-3 border-b border-border/40 shrink-0 flex flex-col md:flex-row gap-4 items-center justify-between bg-surface z-20 shadow-sm">

    <nav class="flex items-center gap-2 text-[11px] font-bold tracking-wider uppercase whitespace-nowrap overflow-x-auto max-w-full">
        <button *ngIf="currentPath.length > 0" (click)="goBack()"
          class="flex items-center gap-1 text-text-light hover:text-primary transition-colors pr-3 border-r border-border/50">
           <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
           Atrás
        </button>
        <span (click)="resetNavigation()" class="cursor-pointer transition-colors hover:text-primary"
              [ngClass]="currentPath.length === 0 ? 'text-primary' : 'text-text-light'">
           Todas
        </span>
        <ng-container *ngFor="let item of currentPath">
          <span class="text-border">/</span>
          <span class="text-primary truncate">{{ item.name }}</span>
        </ng-container>
    </nav>

    <div class="relative w-full md:w-72 group">
      <input type="text" [(ngModel)]="searchTerm" (input)="filterCategories()" placeholder="Buscar especialidad..."
        class="w-full bg-background border border-border/60 rounded-lg pl-9 pr-3 py-2 text-xs font-medium focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
      <svg class="absolute left-3 top-2.5 w-4 h-4 text-text-light/70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth bg-background/20">

    <div *ngIf="!isLoading"
         class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-3">

      <div *ngFor="let cat of filteredCategories"
        (click)="handleNavigation(cat)"
        class="group relative bg-card-bg hover:bg-card-bg-hover rounded-lg border border-border/40 hover:border-primary/50 transition-all duration-150 cursor-pointer overflow-hidden flex flex-col hover:shadow-md h-[110px]"
        [ngClass]="{'ring-1 ring-primary bg-primary/5': isSelected(cat)}"
      >
        <div class="p-3.5 flex flex-col h-full relative z-10 justify-between">

          <div class="flex justify-between items-start gap-2">
            <h3 class="font-bold text-text text-sm leading-tight group-hover:text-primary transition-colors line-clamp-2">
               {{ cat.name }}
            </h3>

            <div *ngIf="isSelected(cat)" class="shrink-0 text-primary">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            </div>
          </div>

          <p class="text-[10px] text-text-light leading-snug line-clamp-2 opacity-70">
             {{ cat.description || 'Servicios profesionales.' }}
          </p>

          <div *ngIf="canNavigateDeeper()" class="mt-1 flex justify-end">
             <span class="text-[9px] uppercase font-bold text-primary/70 tracking-wider group-hover:text-primary flex items-center gap-1">
               Explorar <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
             </span>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="isLoading" class="flex flex-col justify-center items-center py-20 opacity-50"><div class="w-6 h-6 border-2 border-primary rounded-full animate-spin"></div></div>
  </div>

  <div *ngIf="tempSelectedCategories.length > 0" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-30 animate-fade-in-up">
    <button (click)="confirm()" class="bg-primary text-white pl-6 pr-2 py-2 rounded-full shadow-xl shadow-primary/30 flex items-center gap-4 hover:scale-105 transition-transform">
      <span class="font-bold text-sm">{{ tempSelectedCategories.length }} Seleccionado(s)</span>
      <div class="bg-white/20 rounded-full p-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg></div>
    </button>
  </div>

</div>
