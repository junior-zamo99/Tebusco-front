<div class="dialog-overlay" (click)="onOverlayClick($event)">
  <div class="dialog-container animate-fadeIn">
    <!-- Header con icono (solo si no hay imagen) -->
    @if (!hasImage()) {
      <div class="dialog-header">
        <div class="dialog-icon" [ngClass]="getIconClass()">
          {{ getIcon() }}
        </div>
      </div>
    }

    <!-- Imagen personalizada (si existe) -->
    @if (hasImage()) {
      <div class="dialog-image-container">
        <img
          [src]="config. imageUrl"
          [alt]="config.imageAlt"
          [ngStyle]="getImageStyles()"
          class="dialog-image"
          />
        </div>
      }


      <div class="dialog-content">
        <h2 class="dialog-title">{{ config.title }}</h2>
        <p class="dialog-message">{{ config.message }}</p>
      </div>

      <!-- Botones de acción -->
      <div class="dialog-actions">
        @if (config.showCancel) {
          <button
            class="btn btn-secondary"
            (click)="onCancel()"
            type="button"
            >
            {{ config.cancelText }}
          </button>
        }
        <button
          class="btn btn-primary"
          (click)="onConfirm()"
          type="button"
          >
          {{ config.confirmText }}
        </button>
      </div>
    </div>
  </div>
