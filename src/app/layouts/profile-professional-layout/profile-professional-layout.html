<div class="min-h-[calc(100vh-200px)] bg-background font-sans text-text flex text-sm">

  <!-- Loading Overlay -->
  @if (loading) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-background/90 backdrop-blur-sm">
      <div class="flex flex-col items-center gap-3">
        <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
        <p class="text-primary font-medium animate-pulse text-xs">Cargando...</p>
      </div>
    </div>
  }

  <!-- Sidebar Desktop -->
  <aside class="w-56 bg-card-bg border-r border-border hidden lg:flex flex-col sticky top-14 h-[calc(100vh-56px)] z-10 flex-shrink-0">
    <div class="p-5">
      <button (click)="goBack()" class="flex items-center gap-2 text-text-light hover:text-text text-xs mb-3 transition-colors">
        <i class="fas fa-arrow-left"></i>
        <span>Volver al Dashboard</span>
      </button>
      <h2 class="text-lg font-bold text-text mb-0.5">Mi Cuenta</h2>
      <p class="text-[10px] text-text-muted">Gestión de perfil</p>
    </div>

    <nav class="flex-1 px-3 space-y-1">
      @for (tab of tabs; track tab) {
        <a
          [routerLink]="['/professional/profile', tab.path]"
          routerLinkActive="bg-gradient-primary text-white shadow-primary"
          class="w-full flex items-center gap-2.5 px-3 py-2 text-xs font-medium rounded-lg transition-all duration-200 group text-text-light hover:bg-card-bg-light hover:text-text">
          <i [class]="tab.icon" class="text-text-muted group-hover:text-text"></i>
          {{ tab.label }}
        </a>
      }
    </nav>


  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-4 lg:p-6">
    <!-- Mobile Header -->
    <div class="lg:hidden mb-4">
      <div class="flex justify-between items-center mb-3">
        <button (click)="goBack()" class="flex items-center gap-2 text-text-light hover:text-text text-xs">
          <i class="fas fa-arrow-left"></i>
          <span>Volver</span>
        </button>
        <h1 class="text-lg font-bold text-text">Mi Perfil</h1>
      </div>

      <!-- Mobile Navigation -->
      <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
        @for (tab of tabs; track tab) {
          <a
            [routerLink]="['/professional/profile', tab.path]"
            routerLinkActive="bg-gradient-primary text-white"
            class="flex-shrink-0 px-3 py-1.5 text-xs font-medium rounded-full bg-card-bg-light text-text-light hover:text-text transition-colors">
            {{ tab.label }}
          </a>
        }
      </div>
    </div>

    <!-- Router Outlet for child routes -->
    @if (!loading) {
      <div class="max-w-4xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    }
  </main>
</div>
